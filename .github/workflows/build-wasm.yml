name: Build WASM and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM
        shell: bash
        run: |
          em++ \
            wasm/puyoAI.cpp \
            ai/ai.cpp \
            ai/gtr/gtr_ai.cpp \
            ai/search/move_generator.cpp \
            ai/search/beam_search.cpp \
            ai/simulation/board.cpp \
            ai/simulation/simulator.cpp \
            ai/evaluation/features.cpp \
            ai/evaluation/evaluation.cpp \
            ai/evaluation/weights.cpp \
            ai/evaluation/forms.cpp \
            -std=c++20 \
            -O3 \
            -flto \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=worker \
            -sALLOW_MEMORY_GROWTH=1 \
            -sEXPORTED_FUNCTIONS='["_malloc","_free","_reset_ai","_set_board_cell","_ai_choose_move","_get_ai_pattern_name"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o puyoAI_wasm.mjs

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: puyoAI-wasm
          path: |
            puyoAI_wasm.mjs
            puyoAI_wasm.wasm
